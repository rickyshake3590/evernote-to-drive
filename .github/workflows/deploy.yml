name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets into config files
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          # Check if secrets are set (they should be for deployment to work)
          if [ -z "$APP_PASSWORD" ] || [ -z "$GOOGLE_CLIENT_ID" ]; then
            echo "ERROR: GitHub Secrets not configured!"
            echo "Please set APP_PASSWORD and GOOGLE_CLIENT_ID in Settings → Secrets and variables → Actions"
            exit 1
          fi

          # Replace placeholders in config.js
          sed -i "s|APP_PASSWORD_PLACEHOLDER|$APP_PASSWORD|g" config.js
          sed -i "s|GOOGLE_CLIENT_ID_PLACEHOLDER|$GOOGLE_CLIENT_ID|g" config.js

          # Replace placeholders in index.html
          sed -i "s|APP_PASSWORD_PLACEHOLDER|$APP_PASSWORD|g" index.html
          sed -i "s|GOOGLE_CLIENT_ID_PLACEHOLDER|$GOOGLE_CLIENT_ID|g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v3
